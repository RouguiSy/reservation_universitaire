services:
  mysql:
    image: mysql:8.0
    container_name: reservation-mysql
    env_file:
      - ../.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-reservation_salles}
      MYSQL_USER: ${DB_USERNAME:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD:-root} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: reservation-phpmyadmin
    environment:
      PMA_HOST: ${DB_HOST:-mysql}
      PMA_PORT: ${DB_PORT:-3306}
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: reservation-web
    ports:
      - "8080:80"
    volumes:
      - ../src:/var/www/html/src
      - ../public:/var/www/html/public
      - ../templates:/var/www/html/templates
      - ../config:/var/www/html/config
      - ../routes:/var/www/html/routes
      - ../database:/var/www/html/database
      - ../bin:/var/www/html/bin
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh
      - ../.env:/var/www/html/.env
    env_file:
      - ../.env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
